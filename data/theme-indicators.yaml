version: theme-indicators-v1
# 定義與口徑，無觀測數字；自動來源的 URL／上限只在 sources.yaml 宣告。
indicators:
  - id: aaon-liquid-cooling-revenue
    name: AAON 液冷產品單季收入
    kind: direct
    themes: [liquid-cooling]
    entity: AAON
    scope: BASX-branded liquid cooling sales，具名公司特定產品
    limitations: 不代表全市場滲透率，也不代表其他冷板／CDU 供應商收入
    unit: amount
    currency: USD
    frequency: quarterly
    basis: quarterly
    source_id: aaon-earnings-metrics
    dataset: aaon-liquid-cooling-sales
    measure: liquid-cooling-sales
  - id: avc-monthly-revenue
