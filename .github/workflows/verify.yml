name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate map and validator
        run: |
          python scripts/validate_map.py
          python tests/run_validator_tests.py
      - name: Offline backend tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Require the public coverage route in Git
        run: git ls-files --error-unmatch frontend/app/coverage/page.tsx
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Offline public navigation
        working-directory: frontend
        run: npm run test:e2e:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            frontend/test-results
            frontend/playwright-report/offline
          if-no-files-found: ignore
