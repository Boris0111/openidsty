<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256">
  <title>HBM 堆疊與伺服器 DRAM</title>
  <desc>HBM 把多層 DRAM 疊在一顆邏輯 base die 上，再和加速器一起封裝，換取很高的頻寬。伺服器 DRAM 模組則插在主機板上，提供 CPU 的主記憶體容量。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#267a97"/></marker></defs>
  <rect width="760" height="256" rx="8" fill="#f3f6f7"/>
  <g font-family="Microsoft JhengHei, PingFang TC, sans-serif" fill="#16343a">
    <text x="30" y="38" font-size="20" font-weight="700">HBM 堆疊與伺服器 DRAM</text>
    <text x="36" y="78" font-size="15" font-weight="700">DRAM 堆疊</text>
    <rect x="30" y="92" width="157" height="44" rx="6" fill="#fae9e4" stroke="#c14c38" stroke-width="1.5"/>
    <text x="40" y="119" font-size="14">多層 DRAM die</text>
    <path d="M189 114H209" stroke="#267a97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="217" y="78" font-size="15" font-weight="700">邏輯底層</text>
    <rect x="211" y="92" width="157" height="44" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="221" y="119" font-size="14">base die</text>
    <path d="M370 114H390" stroke="#267a97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="78" font-size="15" font-weight="700">共同封裝</text>
    <rect x="392" y="92" width="157" height="44" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="402" y="119" font-size="14">與加速器同封裝</text>
    <path d="M561 64V216" stroke="#7d8f96" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="579" y="78" font-size="15" font-weight="700">對照：主記憶體</text>
    <rect x="573" y="92" width="157" height="44" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="583" y="119" font-size="14">伺服器 DRAM 模組</text>
    <rect x="573" y="146" width="157" height="44" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="583" y="173" font-size="14">插在主機板供 CPU</text>
    <text x="30" y="234" font-size="13" fill="#526575">圖為原創功能示意。</text>
  </g>
</svg>
