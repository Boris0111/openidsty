<svg xmlns="http://www.w3.org/2000/svg" width="360" height="492" viewBox="0 0 360 492">
  <title>從板材到電路板</title>
  <desc>高速訊號的損耗同時受板材與加工影響。CCL 廠提供材料，PCB 廠負責層疊、對位與鑽孔，兩者需共同符合阻抗與可靠度要求。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#267a97"/></marker></defs>
  <rect width="360" height="492" rx="8" fill="#f3f6f7"/>
  <g font-family="Microsoft JhengHei, PingFang TC, sans-serif" fill="#16343a">
    <text x="22" y="36" font-size="18" font-weight="700">從板材到電路板</text>
    <text x="22" y="70" font-size="15" font-weight="700">材料</text>
    <rect x="22" y="80" width="316" height="38" rx="6" fill="#fae9e4" stroke="#c14c38" stroke-width="1.5"/>
    <text x="32" y="104" font-size="14">銅箔</text>
    <rect x="22" y="124" width="316" height="38" rx="6" fill="#fae9e4" stroke="#c14c38" stroke-width="1.5"/>
    <text x="32" y="148" font-size="14">樹脂與玻纖</text>
    <path d="M180 168V188" stroke="#267a97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="22" y="202" font-size="15" font-weight="700">板材</text>
    <rect x="22" y="212" width="316" height="38" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="32" y="236" font-size="14">銅箔基板 CCL</text>
    <path d="M180 256V276" stroke="#267a97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="22" y="290" font-size="15" font-weight="700">成板加工</text>
    <rect x="22" y="300" width="316" height="38" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="32" y="324" font-size="14">層疊壓合</text>
    <rect x="22" y="344" width="316" height="38" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="32" y="368" font-size="14">鑽孔電鍍</text>
    <path d="M180 388V408" stroke="#267a97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="22" y="422" font-size="15" font-weight="700">成品</text>
    <rect x="22" y="432" width="316" height="38" rx="6" fill="#e3eef3" stroke="#267a97" stroke-width="1.5"/>
    <text x="32" y="456" font-size="14">高多層伺服器板</text>
  </g>
</svg>
